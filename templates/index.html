<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare — My Plants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,600;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div class="sidebar-logo">
        <span class="logo-leaf">✦</span>
        <span class="logo-text">PlantCare</span>
    </div>

    <nav class="sidebar-nav">
        <a href="/" class="nav-item active">
            <span class="nav-icon">❧</span>
            <span>All Plants</span>
        </a>
        <a href="#" class="nav-item" id="nav-needs-water" onclick="filterNeedsWater(event)">
            <span class="nav-icon">💧</span>
            <span>Needs Water</span>
            <span class="nav-badge" id="needs-water-count">0</span>
        </a>
        <a href="#" class="nav-item" onclick="openAddModal(event)">
            <span class="nav-icon">＋</span>
            <span>Add Plant</span>
        </a>

        <div class="nav-links">
            <a href="/ai" class="btn-ai">🤖 AI Assistant</a>

        </div>
    </nav>

    <div class="sidebar-stats">
        <div class="stat-card">
            <div class="stat-value" id="stat-total">—</div>
            <div class="stat-label">plants</div>
        </div>
        <div class="stat-card">
            <div class="stat-value accent" id="stat-needs">—</div>
            <div class="stat-label">need water</div>
        </div>
        <div class="stat-card">
            <div class="stat-value green" id="stat-today">—</div>
            <div class="stat-label">watered today</div>
        </div>
    </div>

    <div class="water-all-wrap">
        <button class="btn-water-all" onclick="waterAll()">
            <span>💧</span> Water All
        </button>
    </div>
</aside>

<!-- MAIN -->
<main class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <div class="topbar-left">
            <h1 class="page-title" id="page-title">My Plants</h1>
            <span class="plant-count" id="plant-count-label"></span>
        </div>
        <div class="topbar-right">
            <div class="search-wrap">
                <span class="search-icon">⌕</span>
                <input type="text" class="search-input" placeholder="Search by name..." id="search-input">
            </div>
            <div class="view-toggle">
                <button class="view-btn active" id="view-grid" onclick="setView('grid')">⊞</button>
                <button class="view-btn" id="view-list" onclick="setView('list')">☰</button>
            </div>
        </div>
    </div>

    <!-- PLANTS GRID -->
    <div class="plants-grid" id="plants-container">
        <div class="loading-state">
            <div class="loading-spinner"></div>
            <p>Loading plants...</p>
        </div>
    </div>

    <!-- EMPTY STATE -->
    <div class="empty-state hidden" id="empty-state">
        <div class="empty-icon">🌱</div>
        <h2>Nothing here yet</h2>
        <p>Add your first plant to get started</p>
        <button class="btn-primary" onclick="openAddModal()">Add Plant</button>
    </div>
</main>


<!-- MODAL: ДОБАВИТЬ / РЕДАКТИРОВАТЬ -->
<div class="modal-overlay hidden" id="modal-plant">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title" id="modal-title">New Plant</h2>
            <button class="modal-close" onclick="closeModal('modal-plant')">✕</button>
        </div>
        <form class="modal-form" id="plant-form" onsubmit="submitPlant(event)">
            <input type="hidden" id="edit-plant-id">

            <div class="form-row">
                <div class="form-group">
                    <label>Name *</label>
                    <input type="text" id="f-name" placeholder="Ficus Benjamina" required>
                </div>
                <div class="form-group">
                    <label>Nickname</label>
                    <input type="text" id="f-nickname" placeholder="Freddy">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="f-location" placeholder="Kitchen windowsill">
                </div>
                <div class="form-group">
                    <label>Water every (days) *</label>
                    <input type="number" id="f-interval" placeholder="7" min="1" max="365" required>
                </div>
            </div>

            <div class="form-group">
                <label>Notes</label>
                <textarea id="f-notes" placeholder="Loves sunlight, hates drafts..."></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal('modal-plant')">Cancel</button>
                <button type="submit" class="btn-primary" id="form-submit-btn">Add</button>
            </div>
        </form>
    </div>
</div>


<!-- MODAL: ИСТОРИЯ -->
<div class="modal-overlay hidden" id="modal-history">
    <div class="modal modal-sm">
        <div class="modal-header">
            <h2 class="modal-title" id="history-title">History</h2>
            <button class="modal-close" onclick="closeModal('modal-history')">✕</button>
        </div>
        <div class="history-list" id="history-list">
            <div class="loading-spinner"></div>
        </div>
    </div>
</div>


<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>


<script src="/static/app.js"></script>
</body>
</html>
