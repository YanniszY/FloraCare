services:

  app:
    build: .
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    network_mode: host
    volumes:
      - .:/app
      - ./uploads:/app/uploads
    env_file:
      - .env
    environment:
      - OLLAMA_URL=http://localhost:11434
    restart: unless-stopped

  bot:
    build: .
    command: sh -c "sleep 5 && python -m tgbot.bot"
    network_mode: host
    volumes:
      - .:/app
      - ./plants.db:/app/plants.db
    env_file:
      - .env
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    network_mode: host
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_data: